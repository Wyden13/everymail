name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Same image and tuning as compose.yaml; the Backend tests of job queries run against it
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: everymail
          POSTGRES_DB: everymail
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:everymail@localhost:5432/everymail
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      - name: Protobuf breaking changes
        if: github.event_name == 'pull_request'
        run: bunx buf breaking proto --against "https://github.com/${{ github.repository }}.git#branch=${{ github.base_ref }},subdir=proto"
      - run: bun run gen
      - run: bun run wasm
      - run: bun run check
      - run: bun run --cwd site build
      - run: bun run --cwd frontend build
      - name: Bundle sizes
        run: |
          echo '| JS file | bytes | gzip |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          for f in frontend/dist/assets/*.js frontend/dist/*.js; do
            echo "| ${f#frontend/dist/} | $(wc -c < "$f") | $(gzip -c "$f" | wc -c) |" >> "$GITHUB_STEP_SUMMARY"
          done
