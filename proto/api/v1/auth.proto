syntax = "proto3";

package api.v1;

// Engine to Backend. Wire: POST /api.v1.AuthService/<Method>, body application/proto.
// The provider redirects to the Backend's GET /auth/callback, which finishes the sign-in.
service AuthService {
  // Public. Returns the provider page to open. A native client also gets the claim it collects the session with.
  // A web client gets no claim: the Backend keeps it in a cookie, so the sign-in finishes only in the browser that started it.
  rpc StartSignIn(StartSignInRequest) returns (StartSignInResponse);
  // Public, native clients only: collects the session once the callback has finished. Single use.
  rpc FinishSignIn(FinishSignInRequest) returns (FinishSignInResponse);
  // Signed in. Who the calling session belongs to: how a web app, which never holds its session cookie, learns it is signed in.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  // Signed in. Ends the calling session.
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
}

// An unset oneof is a decode error, never a state.
message StartSignInRequest {
  oneof provider {
    Google google = 1;
    Microsoft microsoft = 2;
  }
  // Web: the callback sets the session cookie and returns to the app.
  // Native: the callback sends the browser back to the app with a handoff, and the app collects the session.
  oneof client {
    Native native = 3;
    Web web = 4;
  }
}

message Google {}

message Microsoft {}

// A native sign-in finishes only on the device that ran the browser: the session is collected with the claim,
// which only the app that started holds, plus the handoff, which only reaches the device the browser ran on.
// An unset oneof is a decode error, never a state.
message Native {
  // Where the callback sends the browser. Phones add an app link here.
  oneof return {
    Loopback loopback = 1;
  }
}

// The app listens on 127.0.0.1 at this port until the browser POSTs the form field `handoff` to `/`.
// The handoff is good for 60 seconds.
message Loopback {
  // 1024 to 65535; anything else is refused as a bad request
  uint32 port = 1;
}

message Web {}

message StartSignInResponse {
  string authorize_url = 1;
  // Empty for a web client
  string claim = 2;
  // How long the attempt lives from now: a native client listens on its loopback no longer
  uint32 expires_in_seconds = 3;
}

message FinishSignInRequest {
  string claim = 1;
  // What the browser brought back to the app. Empty until then: the answer is pending, denied, failed or expired, never a session
  string handoff = 2;
}

// An unset oneof is a decode error, never a state.
message FinishSignInResponse {
  oneof outcome {
    SignedIn signed_in = 1;
    // The user has not finished at the provider yet
    SignInPending pending = 2;
    // The user cancelled at the provider
    SignInDenied denied = 3;
    // The code exchange or the ID token check failed
    SignInFailed failed = 4;
    // Unknown claim, already collected, or older than 600 seconds
    SignInExpired expired = 5;
  }
}

message SignedIn {
  string bearer = 1;
  // The user's email at the provider the attempt was started with, for display
  string email = 2;
}

message SignInPending {}

message SignInDenied {}

message SignInFailed {}

message SignInExpired {}

message GetSessionRequest {}

// An unset oneof is a decode error, never a state.
message GetSessionResponse {
  oneof provider {
    Google google = 1;
    Microsoft microsoft = 2;
  }
  string email = 3;
}

message SignOutRequest {}

message SignOutResponse {}
