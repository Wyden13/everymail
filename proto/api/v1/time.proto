syntax = "proto3";

package api.v1;

// When something the client schedules comes due. The Backend computes the UTC instant when the request arrives.
// An unset oneof is a decode error, never a state.
message ScheduledTime {
  oneof at {
    // Seconds since the Unix epoch
    int64 unix_seconds = 1;
    WallTime wall = 2;
  }
}

// A clock time in a zone. One skipped by a daylight saving change moves forward by the gap;
// one that happens twice is the later. A date, time or zone that does not exist is refused as a bad request.
message WallTime {
  uint32 year = 1;
  // 1 to 12
  uint32 month = 2;
  // 1 to 31
  uint32 day = 3;
  // 0 to 23, or 24 with minute 0 for the end of the day
  uint32 hour = 4;
  // 0 to 59
  uint32 minute = 5;
  // IANA, such as Europe/Berlin
  string zone = 6;
}

// How often something repeats. An unset oneof is a decode error, never a state.
message Schedule {
  oneof every {
    // A fixed gap after the previous run: 900 is every 15 minutes, 3600 every hour, any other value is custom
    uint32 interval_seconds = 1;
    // Each day at this clock time in its zone
    ClockTime daily = 2;
    // Monday to Friday in the zone, at this clock time
    ClockTime weekdays = 3;
  }
}

// A time of day in a zone, kept as wall time so it follows daylight saving changes.
// A time a change skips moves forward by the gap; one that happens twice is the later, so each day runs once.
message ClockTime {
  // 0 to 23
  uint32 hour = 1;
  // 0 to 59
  uint32 minute = 2;
  // IANA, such as Europe/Berlin
  string zone = 3;
}
