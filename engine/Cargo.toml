[package]
name = "everymail-engine"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = "0.4"
prost = "0.14"
rusqlite = { version = "0.42", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false }

# Native sign-in's loopback listener. tokio is already the runtime reqwest and the hosts run on
# natively; these are the features the listener uses (`macros` for `select!`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "sync", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# A runtime for the one socket test
tokio = { version = "1", features = ["rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# rusqlite's default on wasm32 is sqlite-wasm-rs; its wasm-bindgen feature supplies the host
# functions (sleep, randomness) the SQLite build needs.
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }

[build-dependencies]
prost-build = { version = "0.14", default-features = false }
protox = "0.10"
serde_json = "1"

# wasm-pack's wasm-opt validates against the MVP; enable the features rustc emits for wasm32 by default.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-multivalue",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-sign-ext",
]
